# Toy hit filter. Compare with hepattn's experiments/trackml/configs/filtering.yaml.
#
#   python -m minihep.run_filter fit  --config configs/toy_filter.yaml
#   python -m minihep.run_filter test --config logs/<run dir>/config.yaml --data.test_dir data/toy/train
#   (repeat test for val and test: the PredictionWriter names each file after the split)

seed_everything: 42
name: toy-filter

data:
  train_dir: data/toy/train
  val_dir: data/toy/val
  test_dir: data/toy/test
  num_train: -1
  num_val: 100
  num_test: -1
  num_workers: 2
  particle_min_pt: 1.0
  particle_max_abs_eta: 2.5
  particle_min_num_hits: 3
  event_max_num_particles: 32
  inputs:
    hit: &hit_fields [x, y, z, r, eta, phi]
  targets:
    hit: [on_valid_particle]

trainer:
  max_epochs: 5
  accelerator: auto
  devices: 1
  precision: 32-true
  log_every_n_steps: 50
  default_root_dir: logs
  gradient_clip_val: 1.0
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: logs
  callbacks:
    - class_path: minihep.lightning.callbacks.SaveMetadata
    - class_path: minihep.lightning.callbacks.Checkpoint
    - class_path: minihep.lightning.callbacks.PredictionWriter
      init_args:
        write_targets: false
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor

model:
  optimizer: AdamW
  lrs_config:
    initial: 1e-4
    max: 1e-3
    end: 1e-5
    pct_start: 0.05
    weight_decay: 1e-5
  model:
    class_path: minihep.models.HitFilter
    init_args:
      input_sort_field: phi
      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: minihep.models.InputNet
              init_args:
                input_name: hit
                fields: *hit_fields
                net:
                  class_path: minihep.models.Dense
                  init_args:
                    input_size: 6
                    hidden_layers: [64]
                    output_size: &dim 64
                posenc:
                  class_path: minihep.models.PositionEncoder
                  init_args:
                    input_name: hit
                    fields: [r, eta, phi]
                    sym_fields: [phi]
                    dim: *dim
                    alpha: 10
      encoder:
        class_path: minihep.models.Encoder
        init_args:
          num_layers: 2
          dim: *dim
          attn_kwargs: {num_heads: 4}
      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: minihep.models.HitFilterTask
              init_args:
                name: hit_filter
                input_object: hit
                target_field: on_valid_particle
                dim: *dim
                threshold: 0.1
